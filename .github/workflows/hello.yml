name: Hello World Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Print Hello World
        run: echo "Hello World!"
      - name: Print current date
        run: date
      - name: List directory contents
        run: ls -la